<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Método Hardmaxx</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Geist+Mono:wght@400&display=swap">
<style>
:root{--ink:#0E1215;--ink-soft:#3F4A52;--ink-faint:#6E7A83;--paper:#F2F4F5;--line:#D2D9DC;--accent:#2C6E9B;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--ink:#EDF1F3;--ink-soft:#A9B5BD;--ink-faint:#78858D;--paper:#0E1215;--line:#2C353B;--accent:#63A8D4;--accent-ink:#0E1215}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;background:var(--paper);color:var(--ink);
  font-family:"Manrope","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:24px}
main{max-width:680px;margin:0 auto;padding:40px 24px}
.code{font-family:"Geist Mono",ui-monospace,monospace;font-size:12px;line-height:16px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-faint);display:flex;align-items:center;gap:8px}
.code::before{content:"";width:24px;height:1px;background:var(--accent)}
h1{margin:16px 0 0;font-size:36px;line-height:40px;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
p{margin:16px 0 0;font-size:18px;line-height:28px;color:var(--ink-soft);text-wrap:pretty}
a.btn{display:inline-flex;margin-top:40px;padding:12px 24px;border-radius:999px;background:var(--accent);
  color:var(--accent-ink);text-decoration:none;font-weight:600;font-size:18px;line-height:28px;
  transition:all 700ms cubic-bezier(.32,.72,0,1)}
a.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
a.btn:active{transform:scale(.98)}
a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <span class="code">Erro 404</span>
  <h1>Esta página não existe.</h1>
  <p>O endereço está errado ou o conteúdo foi movido. A página do guia continua no lugar de sempre.</p>
  <a class="btn" href="/">Voltar para o início</a>
</main>
</body>
</html>
